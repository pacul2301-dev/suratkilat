<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuratKilat — Persuratan & Arsip Digital</title>
<meta name="description" content="Sistem manajemen persuratan otomatis, persetujuan PIN, disposisi, dan arsip digital ber-QR.">
<meta name="theme-color" content="#2563C9">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" id="ms-font" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<link rel="stylesheet" href="css/app.css?v=1.0.0">
<script>try { var t = localStorage.getItem('sk_tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }</script>
</head>
<body>
<div id="login" class="login" hidden></div>

<div class="frame" id="shell" hidden>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="brand"><div class="brand-logo"><span class="ms fill">bolt</span></div><span class="brand-name">SuratKilat</span><span class="brand-ver">v1.0</span></div>
      <a class="btn-cta" href="#/buat"><span class="ms">add</span><span>Buat Surat Baru</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="sys" id="sysBox"></div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn hamburger" id="btnMenu" aria-label="Buka menu"><span class="ms">menu</span></button>
        <div class="mtitle"><span class="ms fill">bolt</span>SuratKilat</div>
        <label class="search"><span class="ms">search</span><input id="cari" type="search" placeholder="Cari nomor surat, perihal, instansi pengirim…" autocomplete="off" aria-label="Pencarian global"></label>
        <div class="tb-actions">
          <button class="icon-btn" id="btnNotif" aria-label="Notifikasi"><span class="ms">notifications</span><i class="dot" id="notifDot" hidden></i></button>
          <button class="icon-btn tb-hide-m" id="btnBantuan" aria-label="Bantuan"><span class="ms">help</span></button>
          <a class="icon-btn tb-hide-m" href="#/pengaturan" aria-label="Pengaturan"><span class="ms">settings</span></a>
          <span class="tb-sep"></span>
          <button class="me" id="btnMe" aria-label="Akun saya"><span class="avatar" id="meAv"></span><span class="me-txt"><b id="meNama"></b><small id="mePeran"></small></span></button>
          <button class="icon-btn tb-hide-m" id="btnTema" aria-label="Ganti tema terang/gelap"><span class="ms">tune</span></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi bawah"></nav>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/config.js?v=1.0.0"></script>
<script src="js/core.js?v=1.0.0" defer></script>
<script src="js/charts.js?v=1.0.0" defer></script>
<script src="js/pages-surat.js?v=1.0.0" defer></script>
<script src="js/pages-lain.js?v=1.0.0" defer></script>
<script src="js/app.js?v=1.0.0" defer></script>
</body>
</html>
